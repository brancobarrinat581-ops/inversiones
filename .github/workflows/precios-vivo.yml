name: Precios en vivo

# Por que esto existe:
# GitHub ejecuta los cron de repos gratuitos "cuando puede". La vuelta: en lugar
# de pedir muchas corridas cortas, pedimos pocas corridas LARGAS. Una sola que
# arranque cubre varias horas actualizando cada 10 minutos.
on:
  schedule:
    # Medido sobre las corridas reales: GitHub esta disparando estos cron con 8 a
    # 11 horas de atraso, no con 1 o 2. Los arranques de 11-18 UTC del 24 se
    # ejecutaron entre las 22:19 y las 02:15, con la rueda cerrada, y el corte por
    # horario los mataba en una vuelta. Por eso ahora los arranques empiezan de
    # madrugada: con ese atraso caen dentro de la rueda, y si algun dia GitHub
    # dispara en hora, el que arranca temprano espera la apertura en vez de morirse.
    - cron: '5 2 * * 1-5'
    - cron: '5 4 * * 1-5'
    - cron: '5 6 * * 1-5'
    - cron: '5 8 * * 1-5'
    - cron: '5 10 * * 1-5'
    - cron: '5 12 * * 1-5'
    - cron: '5 14 * * 1-5'
    - cron: '5 16 * * 1-5'
    - cron: '5 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Compartido con "Update Prices" para que nunca commiteen los dos a la vez.
concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Actualizar precios cada 15 minutos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GH_TOKEN="${{ github.token }}"

          # Corta a las 21:00 UTC (18:00 AR, rueda cerrada) o a las 5h50, lo que
          # pase primero. El limite de un job de Actions es 6 horas.
          FIN=$(( $(date -u +%s) + 21000 ))
          VUELTA=0

          while true; do
            VUELTA=$((VUELTA+1))
            echo "::group::Vuelta $VUELTA — $(date -u +'%H:%M UTC')"

            if node scripts/fetch-prices.js && node scripts/validate-ops.js; then
              node scripts/snapshot.js || true
              node scripts/alertas.js || true
              node -e "for(const x of require('./alertas-nuevas.json')) console.log(JSON.stringify({t:x.titulo,b:x.texto}))" 2>/dev/null | while read -r linea; do
                TIT=$(echo "$linea" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).t))")
                CUE=$(echo "$linea" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).b))")
                gh issue create --title "$TIT" --body "$CUE" --label alerta || echo "no pude crear el issue"
              done
              git add prices.json history.json alertas.json
              if git diff --staged --quiet; then
                echo "Sin cambios"
              else
                git commit -m "💰 Precios $(date -u +'%Y-%m-%d %H:%M UTC')"
                git pull --rebase origin main || true
                git push || (sleep 10 && git fetch origin main && git rebase origin/main && git push) \
                  || (sleep 30 && git fetch origin main && git rebase origin/main && git push) \
                  || { echo "push fallido, descarto y sigo"; git rebase --abort 2>/dev/null || true; git reset --hard origin/main; }
              fi
            else
              echo "⚠️ Los precios no pasaron la validacion, no commiteo esta vuelta"
              git checkout -- prices.json || true
            fi
            echo "::endgroup::"

            AHORA=$(date -u +%s)
            HORA=$(date -u +%H)

            # Despues del cierre no hay nada que mirar: se guarda el ultimo precio
            # y se corta, asi el proximo arranque encuentra el lugar libre.
            if [ "$AHORA" -ge "$FIN" ] || [ "$HORA" -ge 21 ]; then
              echo "Listo: $VUELTA actualizaciones."
              break
            fi

            # Antes de la apertura: esperar SOLO si la apertura entra en la ventana
            # que le queda al job. Hasta hoy una corrida que caia a las 02:00 hacia
            # una vuelta y se iba, y despues no quedaba nadie despierto durante la
            # rueda. Pero esperar sin llegar tampoco sirve: quema minutos de Actions
            # para nada, asi que en ese caso guarda el cierre y corta.
            if [ "$HORA" -lt 14 ]; then
              FALTA=$(( (14 - HORA) * 3600 ))
              RESTA=$(( FIN - AHORA ))
              if [ "$FALTA" -le "$RESTA" ]; then
                echo "Mercado cerrado. Espero $((FALTA/60)) min hasta la apertura."
                sleep "$FALTA"
                continue
              fi
              echo "Listo: $VUELTA actualizaciones (la apertura no entra en esta ventana)."
              break
            fi

            sleep 600
          done
