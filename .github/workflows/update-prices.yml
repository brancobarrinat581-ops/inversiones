name: Update Prices

on:
  schedule:
    # Cada 30 min, lunes a viernes, 13:00-21:00 UTC (10:00-18:00 Argentina)
    - cron: '*/30 13-21 * * 1-5'
    # Una vez a las 22:00 UTC (cierre)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Trigger manual

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices
        run: node scripts/fetch-prices.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "📊 Update prices $(date -u +%H:%M)"
            git push
          fi
