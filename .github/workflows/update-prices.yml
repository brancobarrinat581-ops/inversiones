name: Update Prices

on:
  schedule:
    # minutos 'raros' para que GitHub no descarte las corridas (las de :00 y :30 se saturan)
    - cron: '7,27,47 13-20 * * 1-5'
    - cron: '17 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ping Supabase para que no se pause por inactividad
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "Supabase: HTTP %{http_code}\n" \
            "https://bezxlrkolpfaeqvyxckj.supabase.co/rest/v1/operaciones?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlenhscmtvbHBmYWVxdnl4Y2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5ODcwOTYsImV4cCI6MjA5OTU2MzA5Nn0.ZbHLp-0f8M7quTPA8QUM5a64LuDxdFSs5Q1u9xGej8Y"

      - name: Fetch Prices
        run: node scripts/fetch-prices.js

      # Si los precios quedaron mal, la corrida falla y no se guarda nada.
      - name: Validar datos
        run: node scripts/validate-ops.js

      # Foto diaria de la cartera: es lo que alimenta la curva de evolucion.
      - name: Snapshot
        run: node scripts/snapshot.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "💰 Update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push || (sleep 5 && git pull --rebase origin main && git push)
          fi
