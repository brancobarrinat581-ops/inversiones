  <head>

      body { background:#0f0f0f; color:#e8e6e3; font-family:system-ui,-apple-system,sans-serif; }

    <script>
    // Auth bridge: intercepta Supabase auth para login local
    // No modifica app.js — solo intercepta fetch a endpoints de auth
    (function() {
      var EMAIL = "brancobarrinat581@gmail.com";
      var PASS = "45490855";
      var UID = "dd9be8e9-14f1-4c27-bb96-4e6b6cb24f06";
      var SUPA_HOST = "bezxlrkolpfaeqvyxckj.supabase.co";
      var SKEY = "sb-bezxlrkolpfaeqvyxckj-auth-token";
      var TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjo0MTAyNDQ0ODAwLCJpYXQiOjE3ODU4NzgxMDAsImlzcyI6Imh0dHBzOi8vYmV6eGxya29scGZhZXF2eXhja2ouc3VwYWJhc2UuY28vYXV0aC92MSIsInN1YiI6ImRkOWJlOGU5LTE0ZjEtNGMyNy1iYjk2LTRlNmI2Y2IyNGYwNiIsImVtYWlsIjoiYnJhbmNvYmFycmluYXQ1ODFAZ21haWwuY29tIiwicm9sZSI6ImF1dGhlbnRpY2F0ZWQiLCJzZXNzaW9uX2lkIjoiMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAxIiwiYWFsIjoiYWFsMSIsImFtciI6W3sibWV0aG9kIjoicGFzc3dvcmQiLCJ0aW1lc3RhbXAiOjE3ODU4NzgxMDB9XX0.dshyFRmmLwnjqhkI7r6gU10zX9rq-5H564wXsDW2JsA";

      var USER_OBJ = {
        id: UID,
        aud: "authenticated",
        role: "authenticated",
        email: EMAIL,
        email_confirmed_at: "2024-01-01T00:00:00Z",
        phone: "",
        confirmed_at: "2024-01-01T00:00:00Z",
        last_sign_in_at: new Date().toISOString(),
        app_metadata: { provider: "email", providers: ["email"] },
        user_metadata: {},
        identities: [{
          id: UID,
          user_id: UID,
          identity_data: { email: EMAIL, sub: UID },
          provider: "email",
          last_sign_in_at: "2024-01-01T00:00:00Z",
          created_at: "2024-01-01T00:00:00Z",
          updated_at: new Date().toISOString()
        }],
        created_at: "2024-01-01T00:00:00Z",
        updated_at: new Date().toISOString()
      };

      function makeSession() {
        return {
          access_token: TOKEN,
          token_type: "bearer",
          expires_in: 86400,
          expires_at: Math.floor(Date.now() / 1000) + 86400,
          refresh_token: "local-refresh-" + Date.now(),
          user: USER_OBJ
        };
      }

      function fakeOk(data) {
        return Promise.resolve(new Response(JSON.stringify(data), {
          status: 200,
          statusText: "OK",
          headers: {
            "Content-Type": "application/json",
            "X-Supabase-Api-Version": "2024-01-01"
          }
        }));
      }

      function fakeErr(msg, code) {
        return Promise.resolve(new Response(JSON.stringify({
          error: "invalid_grant",
          error_description: msg
        }), {
          status: code || 400,
          statusText: "Bad Request",
          headers: {
            "Content-Type": "application/json",
            "X-Supabase-Api-Version": "2024-01-01"
          }
        }));
      }

      var _fetch = window.fetch.bind(window);
      window.fetch = function(url, opts) {
        var u = typeof url === "string" ? url : (url && url.url ? url.url : "");

        // Solo interceptar requests al host de Supabase auth
        if (u.indexOf(SUPA_HOST) === -1) {
          return _fetch.apply(this, arguments);
        }

        // Solo interceptar /auth/v1/
        if (u.indexOf("/auth/v1/") === -1) {
          return _fetch.apply(this, arguments);
        }

        try {
          // LOGIN: POST /auth/v1/token?grant_type=password
          if (u.indexOf("grant_type=password") !== -1 && opts && opts.method === "POST") {
            var body = {};
            try { body = JSON.parse(opts.body || "{}"); } catch(e) {}
            if (body.email === EMAIL && body.password === PASS) {
              var sess = makeSession();
              // Guardar en localStorage para que getSession lo encuentre
              try { localStorage.setItem(SKEY, JSON.stringify(sess)); } catch(e) {}
              return fakeOk(sess);
            } else {
              return fakeErr("Email o contraseña incorrecto.");
            }
          }

          // REFRESH TOKEN: POST /auth/v1/token?grant_type=refresh_token
          if (u.indexOf("grant_type=refresh_token") !== -1) {
            var sess = makeSession();
            try { localStorage.setItem(SKEY, JSON.stringify(sess)); } catch(e) {}
            return fakeOk(sess);
          }

          // GET USER: GET /auth/v1/user
          if (u.indexOf("/auth/v1/user") !== -1 && (!opts || opts.method === "GET" || !opts.method)) {
            return fakeOk(USER_OBJ);
          }

          // LOGOUT: POST /auth/v1/logout
          if (u.indexOf("/auth/v1/logout") !== -1) {
            try { localStorage.removeItem(SKEY); } catch(e) {}
            return Promise.resolve(new Response("", {
              status: 204,
              statusText: "No Content",
              headers: { "X-Supabase-Api-Version": "2024-01-01" }
            }));
          }

          // SIGNUP: POST /auth/v1/signup
          if (u.indexOf("/auth/v1/signup") !== -1) {
            return fakeErr("Registro deshabilitado.", 403);
          }

          // RECOVER / cualquier otro auth endpoint
          if (u.indexOf("/auth/v1/") !== -1) {
            return fakeOk({});
          }
        } catch(err) {
          // Si algo falla, dejar pasar al servidor real
          return _fetch.apply(this, arguments);
        }

        return _fetch.apply(this, arguments);
      };
    })();
    </script>
    <script type="module" crossorigin src="/inversiones/app.js"></script>
  </head>
  <body><div id="root"></div></body>
</html>
