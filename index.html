  <script>
  // === 1. PRECARGAR DATOS ANTES DE APP.JS ===
  (async function() {
    // Cargar operaciones: localStorage tiene prioridad
    try {
      var opsLocal = localStorage.getItem('operaciones_raw');
      if (opsLocal && JSON.parse(opsLocal).length > 0) {
        console.log('✅ Operaciones desde localStorage:', JSON.parse(opsLocal).length);
      } else {
        var res = await fetch('operaciones.json?t=' + Date.now());
        if (res.ok) {
          var data = await res.json();
          localStorage.setItem('operaciones_raw', JSON.stringify(data.operaciones));
          console.log('✅ Operaciones semilla cargadas:', data.operaciones.length);
        }
      }
    } catch(e) { console.warn('operaciones: error carga', e); }

    // Backup pasivo cada 30s
    setInterval(function() {
      try {
        var ops = JSON.parse(localStorage.getItem("operaciones_raw") || "[]");
        if (ops.length > 0) console.log("💾 Backup check:", ops.length, "ops en localStorage");
      } catch(e) {}
    }, 30000);
  })();
  </script>

    // Rate limiting
    var login_attempts = {};

    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url !== "string") return origFetch.apply(this, arguments);

      // Signup
      if (url.indexOf("/auth/v1/signup") !== -1) {
        return Promise.resolve(new Response(JSON.stringify({
          error: "signup_disabled", error_description: "Registro deshabilitado"
        }), { status: 400, headers: {"Content-Type":"application/json"} }));
      }

      // Token (login)
      if (url.indexOf("/auth/v1/token") !== -1 && opts && opts.body) {
        var body; try { body = JSON.parse(opts.body); } catch(e) { return origFetch.apply(this, arguments); }
        var email = (body.email || "").toLowerCase();
        var pwd = body.password || "";

        // Rate limit
        var now = Date.now();
        if (login_lock[email] && login_lock[email] > now) {
          var seg = Math.ceil((login_lock[email] - now) / 1000);
          return Promise.resolve(new Response(JSON.stringify({
            error: "too_many_attempts",
            error_description: "Demasiados intentos. Espera " + seg + " segundos."

          return Promise.resolve(new Response(JSON.stringify({
            error: "invalid_credentials", error_description: "Email o contraseña invalidos"
          }), { status: 400, headers: {"Content-Type":"application/json"} }));
        }

        return sha256(pwd).then(function(hash) {
          if (hash === u.passHash) {
            login_attempts[email] = 0;
            return new Response(JSON.stringify({
              access_token: u.token,
              token_type: "bearer",
              expires_in: 36000000,
              refresh_token: u.token,
              user: { id: u.uid, email: email, role: "authenticated" }
            }), { status: 200, headers: {"Content-Type":"application/json"} });
          }
          // Wrong password
          var st = login_attempts[email] = (login_attempts[email] || 0) + 1;
          if (st >= 5) { login_lock[email] = now + 120000; login_attempts[email] = 0; }
          var rest = 5 - st;
          return new Response(JSON.stringify({
            error: "invalid_credentials",
            error_description: rest > 0
              ? "Credenciales invalidas. Te quedan " + rest + " intentos."
              : "Demasiados intentos. Cuenta bloqueada 2 minutos."
          }), { status: 400, headers: {"Content-Type":"application/json"} });
        });
      }

      // Get user (session check)
      if (url.indexOf("/auth/v1/user") !== -1) {
        var auth = (opts && opts.headers && (opts.headers.Authorization || opts.headers.authorization)) || "";
        var tkn = auth.replace("Bearer ", "");
        var found = null;
        Object.keys(USERS).forEach(function(em) {
          if (USERS[em].token === tkn) found = { id: USERS[em].uid, email: em, role: "authenticated" };
        });
        if (found) {
          return Promise.resolve(new Response(JSON.stringify(found),
            { status: 200, headers: {"Content-Type":"application/json"} }));
        }
        return Promise.resolve(new Response(JSON.stringify({ error: "not_authenticated" }),
          { status: 401, headers: {"Content-Type":"application/json"} }));
      }

      // Logout
      if (url.indexOf("/auth/v1/logout") !== -1) {
        return Promise.resolve(new Response("{}", { status: 200, headers: {"Content-Type":"application/json"} }));
      }

      return origFetch.apply(this, arguments);
    };

  <script>
  // === 3. DATOS REALES DE ANALISTAS ===
  (function() {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", "analysts.json?t=" + Date.now(), false);
      x.send(null);
      if (x.status !== 200) return;
      var f = JSON.parse(x.responseText).fundamentals || {};
      var out = {}, n = 0;
      var CON = { strong_buy:"Strong Buy", buy:"Buy", hold:"Hold", underperform:"Sell", sell:"Sell" };
      Object.keys(f).forEach(function(tk) {
        var d = f[tk]; if (!d) return;
        var o = {};
        if (d.target != null)    o.target = Math.round(d.target * 100) / 100;
        if (d.consensus)         o.con = CON[d.consensus] || d.consensus;
        if (d.pe != null)        o.pe = Math.round(d.pe) + (d.forwardPE != null ? "/" + Math.round(d.forwardPE) : "");
        if (d.analysts != null)  o.analistas = d.analysts;
        if (Object.keys(o).length) { o.fuente = d.source || "Yahoo Finance"; out[tk] = o; n++; }
      });
      window.__FUND_REAL = out;
      if (n) console.log("Analistas: " + n + " tickers con datos reales de Yahoo");
    } catch (e) { console.warn("analysts.json no disponible:", e.message); }
  })();
  </script>
