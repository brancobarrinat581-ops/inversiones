    <script>
    // === CARGAR DATOS ANTES DE LA APP ===
    (async function() {
      // 1. Cargar portfolio.json (posiciones exactas IOL)
      try {
        const res = await fetch('portfolio.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('portfolio_iol', JSON.stringify(data));
          console.log('✅ Portfolio IOL cargado:', data.positions.length, 'posiciones');
        }
      } catch(e) { console.warn('portfolio.json no disponible'); }

      // 2. Cargar operaciones: localStorage tiene prioridad (contiene las nuevas)
      try {
        var opsLocal = localStorage.getItem('operaciones_raw');
        if (opsLocal && JSON.parse(opsLocal).length > 0) {
          console.log('✅ Operaciones desde localStorage:', JSON.parse(opsLocal).length);
        } else {
          const res = await fetch('operaciones.json?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem('operaciones_raw', JSON.stringify(data.operaciones));
            console.log('✅ Operaciones semilla cargadas:', data.operaciones.length);
          }
        }
      } catch(e) { console.warn('operaciones: error carga'); }

      // 3. Cargar prices.json
      try {
        const res = await fetch('prices.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('prices_data', JSON.stringify(data));
          console.log('✅ Precios cargados:', data.count, 'tickers');
        }
      } catch(e) { console.warn('prices.json no disponible'); }
    })();
    </script>

      window.fetch = function(url, opts) {
        if (typeof url !== "string" || url.indexOf(SUPA_HOST) === -1) return origFetch.apply(this, arguments);

        if (url.indexOf("/auth/v1/token") !== -1 && opts && opts.body) {
          var body;
          try { body = JSON.parse(opts.body); } catch(e) { return origFetch.apply(this, arguments); }
          if (body.email && body.password) {
            var lk = "login_lock";
            var st;
            try { st = JSON.parse(localStorage.getItem(lk) || '{"n":0,"until":0}'); } catch(e) { st = {n:0,until:0}; }
            if (st.until > Date.now()) {
              var seg = Math.ceil((st.until - Date.now()) / 1000);
              return Promise.resolve(new Response(JSON.stringify({
                error: "too_many_requests",
                error_description: "Demasiados intentos. Espera " + seg + " segundos."

                expires_in: 315360000,
                refresh_token: "fake-refresh-" + u.uid,
                user: { id: u.uid, email: body.email, role: "authenticated" }

              return Promise.resolve(new Response(JSON.stringify(resp), { status:200, headers:{"Content-Type":"application/json"} }));

              st.n = (st.n || 0) + 1;
              if (st.n >= 5) { st.until = Date.now() + 120000; st.n = 0; }
              try { localStorage.setItem(lk, JSON.stringify(st)); } catch(e) {}
              var rest = 5 - (st.n || 0);
              return new Response(JSON.stringify({
                error: "Invalid login credentials",
                error_description: st.until > Date.now()
                  ? "Demasiados intentos. Cuenta bloqueada 2 minutos."
                  : "Credenciales invalidas. Te quedan " + rest + " intentos."
              }), { status:400, headers:{"Content-Type":"application/json"} });
            }
            });
          }
        }

        if (url.indexOf("/auth/v1/signup") !== -1) {
          return Promise.resolve(new Response(JSON.stringify({error:"Signup disabled"}), { status:400, headers:{"Content-Type":"application/json"} }));
        }

        if (url.indexOf("/auth/v1/token?grant_type=refresh_token") !== -1) {
          var authH = (opts && opts.headers) || {};
          var bearer = authH["Authorization"] || authH["authorization"] || "";
          var tok = bearer.replace("Bearer ","");
          for (var email in USERS) {

              }), { status:200, headers:{"Content-Type":"application/json"} }));
            }

        }

        if (url.indexOf("/auth/v1/user") !== -1 && opts && opts.method !== "POST") {
          var authH2 = (opts && opts.headers) || {};

              return Promise.resolve(new Response(JSON.stringify({
                id: USERS[email2].uid, email: email2, role:"authenticated"
              }), { status:200, headers:{"Content-Type":"application/json"} }));
            }
          }
        }

        if (url.indexOf("/auth/v1/logout") !== -1) {
          return Promise.resolve(new Response("{}", { status:200, headers:{"Content-Type":"application/json"} }));

        return origFetch.apply(this, arguments);

    <script>
    // Datos reales de analistas (Yahoo). Se cargan antes de app.js para que pisen la tabla interna.
    // Sincrono a proposito: app.js evalua su tabla al inicializar y no puede esperar un fetch.
    (function() {
      try {
        var x = new XMLHttpRequest();
        x.open("GET", "analysts.json?t=" + Date.now(), false);
        x.send(null);
        if (x.status !== 200) return;
        var f = JSON.parse(x.responseText).fundamentals || {};
        var out = {}, n = 0;
        var CON = { strong_buy:"Strong Buy", buy:"Buy", hold:"Hold", underperform:"Sell", sell:"Sell" };
        Object.keys(f).forEach(function(tk) {
          var d = f[tk]; if (!d) return;
          var o = {};
          if (d.target != null)    o.target = Math.round(d.target * 100) / 100;
          if (d.consensus)         o.con = CON[d.consensus] || d.consensus;
          if (d.pe != null)        o.pe = Math.round(d.pe) + (d.forwardPE != null ? "/" + Math.round(d.forwardPE) : "");
          if (d.analysts != null)  o.analistas = d.analysts;
          if (Object.keys(o).length) { o.fuente = d.source || "Yahoo Finance"; out[tk] = o; n++; }
        });
        window.__FUND_REAL = out;
        if (n) console.log("Analistas: " + n + " tickers con datos reales de Yahoo");
        else   console.log("Analistas: sin datos reales todavia, corre el workflow Update Analysis Data");
      } catch (e) { console.warn("analysts.json no disponible:", e.message); }
    })();
    </script>
