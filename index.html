  <script>
  // 1. DATOS: operaciones.json (fuente unica) + prices.json, cargados ANTES de app.js
  (function(){
    function getJSON(u){try{var x=new XMLHttpRequest();x.open("GET",u+"?t="+Date.now(),false);x.send(null);return x.status===200?JSON.parse(x.responseText):null;}catch(e){console.warn(u,e);return null;}}
    // Cache de precios de app.js (5 min) salteaba la actualizacion de precios en ARS: se borra siempre
    try{localStorage.removeItem("full_cache");localStorage.removeItem("portfolio_iol");}catch(e){}

    var j=getJSON("operaciones.json");
    var ops=j?(Array.isArray(j)?j:j.operaciones):null;
    if(ops&&ops.length){
      // Conservar operaciones cargadas desde la app (_local) que todavia no estan en operaciones.json
      var prev=[];try{prev=JSON.parse(localStorage.getItem("operaciones_raw")||"[]");}catch(e){}
      var key=function(o){return [o.fecha,o.ticker,String(o.tipo).toUpperCase(),Math.abs(+o.cantidad)].join("|");};
      var ya={};ops.forEach(function(o){ya[key(o)]=1;});
      var extra=prev.filter(function(o){return o&&o._local&&!ya[key(o)];});
      localStorage.setItem("operaciones_raw",JSON.stringify(ops.concat(extra)));
      console.log("✅ Operaciones: "+ops.length+" de operaciones.json"+(extra.length?" + "+extra.length+" cargadas en la app (sin subir)":""));
    } else console.warn("⚠️ operaciones.json no disponible: uso las guardadas en este navegador");

    var p=getJSON("prices.json");
    if(p&&p.prices){localStorage.setItem("prices_data",JSON.stringify(p));console.log("✅ Precios "+p.ts);}
  })();
</script>
  <script>
  // 2. AUTH BRIDGE — le da sesion a app.js sin depender del JWT roto de Supabase.
  // OJO: esto NO es seguridad. La validacion corre en el navegador y los datos del repo
  // son publicos. Sirve para que la app arranque y para saber quien entro, nada mas.
  (function(){
    var ITER=250000;
    var U={
      "brancobarrinat581@gmail.com":{u:"dd9be8e9-14f1-4c27-bb96-4e6b6cb24f06",s:"37ff3382b9fac2fb3a7db4d9142cd6d1",h:"7075d32ab530b1840d13f798f0c80d35787e58fcb97b976a2ad9f5dab37d0d12"},
      "corina.pacini77@gmail.com":{u:"ca7f985f-4b40-41da-b55b-86b5bc045bcb",s:"0aa298a0ffacfe11192ccbf78ddbd035",h:"0f81617b93c5ba47f6d11fd4b77974fa0946ff3ba3b9f05229e91522f864adbd"}
    };
    function bytes(hex){var a=new Uint8Array(hex.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(hex.substr(i*2,2),16);return a;}
    function hex(buf){return Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");}
    // PBKDF2 con salt distinto por usuario: si alguien lee el hash del HTML,
    // no lo puede revertir con tablas publicas como pasaba con el SHA-256 pelado.
    function derivar(pw,salt){
      return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"])
        .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",salt:bytes(salt),iterations:ITER,hash:"SHA-256"},k,256);})
        .then(hex);
    }
    function ok(b){return new Response(JSON.stringify(b),{status:200,headers:{"Content-Type":"application/json"}});}
    function er(m){return new Response(JSON.stringify({error:"invalid_credentials",error_description:m}),{status:400,headers:{"Content-Type":"application/json"}});}
    function perfil(e,u){return {id:u,aud:"authenticated",role:"authenticated",email:e,email_confirmed_at:"2025-01-01T00:00:00Z",app_metadata:{provider:"email",providers:["email"]},user_metadata:{},identities:[],created_at:"2025-01-01T00:00:00Z",updated_at:"2025-01-01T00:00:00Z"};}
    function lo(e,u){var n=Math.floor(Date.now()/1000);try{localStorage.setItem("__sess",e);}catch(x){}
      return ok({access_token:"local-token-"+u,token_type:"bearer",expires_in:86400,expires_at:n+86400,refresh_token:"local-refresh-"+u,user:perfil(e,u)});}
    function sesion(){try{var e=localStorage.getItem("__sess");return e&&U[e]?e:null;}catch(x){return null;}}
    var of_=window.fetch;
    window.fetch=function(url,opts){
      if(typeof url!=="string")return of_.apply(this,arguments);
      if(url.indexOf("/auth/v1/signup")!==-1)return Promise.resolve(er("Registro deshabilitado"));
      if(url.indexOf("/auth/v1/token")!==-1){
        var b;try{b=(opts&&opts.body)?JSON.parse(opts.body):{};}catch(e){b={};}
        if(url.indexOf("grant_type=refresh_token")!==-1||b.grant_type==="refresh_token"){
          // Antes esto devolvia siempre el PRIMER usuario, entrara quien entrara:
          // cualquiera quedaba logueado sin contrasena y Corina aparecia como Branco.
          var em0=sesion();
          return Promise.resolve(em0?lo(em0,U[em0].u):er("Sesion expirada"));
        }
        var em=(b.email||"").toLowerCase().trim(),pw=b.password||"";
        if(!U[em])return Promise.resolve(er("Email no registrado"));
        return derivar(pw,U[em].s).then(function(h){return h!==U[em].h?er("Credenciales invalidas"):lo(em,U[em].u);});
      }
      if(url.indexOf("/auth/v1/user")!==-1){
        var em1=sesion();
        if(em1)return Promise.resolve(ok(perfil(em1,U[em1].u)));
        return Promise.resolve(new Response(JSON.stringify({error:"not_authenticated"}),{status:401,headers:{"Content-Type":"application/json"}}));
      }
      if(url.indexOf("/auth/v1/logout")!==-1){try{localStorage.removeItem("__sess");}catch(x){}return Promise.resolve(ok({}));}
      return of_.apply(this,arguments);
    };
  })();
  </script>
