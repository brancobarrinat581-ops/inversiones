  <script>
  // 1. DATOS: operaciones.json (fuente unica) + prices.json, cargados ANTES de app.js
  (function(){
    function getJSON(u){try{var x=new XMLHttpRequest();x.open("GET",u+"?t="+Date.now(),false);x.send(null);return x.status===200?JSON.parse(x.responseText):null;}catch(e){console.warn(u,e);return null;}}
    // Cache de precios de app.js (5 min) salteaba la actualizacion de precios en ARS: se borra siempre
    try{localStorage.removeItem("full_cache");localStorage.removeItem("portfolio_iol");}catch(e){}

    var j=getJSON("operaciones.json");
    var ops=j?(Array.isArray(j)?j:j.operaciones):null;
    if(ops&&ops.length){
      // Conservar operaciones cargadas desde la app (_local) que todavia no estan en operaciones.json
      var prev=[];try{prev=JSON.parse(localStorage.getItem("operaciones_raw")||"[]");}catch(e){}
      var key=function(o){return [o.fecha,o.ticker,String(o.tipo).toUpperCase(),Math.abs(+o.cantidad)].join("|");};
      var ya={};ops.forEach(function(o){ya[key(o)]=1;});
      var extra=prev.filter(function(o){return o&&o._local&&!ya[key(o)];});
      localStorage.setItem("operaciones_raw",JSON.stringify(ops.concat(extra)));
      console.log("✅ Operaciones: "+ops.length+" de operaciones.json"+(extra.length?" + "+extra.length+" cargadas en la app (sin subir)":""));
    } else console.warn("⚠️ operaciones.json no disponible: uso las guardadas en este navegador");

    var p=getJSON("prices.json");
    if(p&&p.prices){localStorage.setItem("prices_data",JSON.stringify(p));console.log("✅ Precios "+p.ts);}
  })();
</script>
