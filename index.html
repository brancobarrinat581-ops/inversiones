  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

  <script>
  // === 1. PRECARGAR OPERACIONES ===
  (async function() {
    try {
      var opsLocal = localStorage.getItem('operaciones_raw');
      if (opsLocal && JSON.parse(opsLocal).length > 0) {
        console.log('✅ Operaciones desde localStorage:', JSON.parse(opsLocal).length);
      } else {
        var res = await fetch('operaciones.json?t=' + Date.now());
        if (res.ok) {
          var data = await res.json();
          localStorage.setItem('operaciones_raw', JSON.stringify(data.operaciones));
          console.log('✅ Operaciones semilla cargadas:', data.operaciones.length);
        }
      }
    } catch(e) { console.warn('operaciones: error carga', e); }
  })();
  </script>

  <script>
  // === 2. AUTH BRIDGE ===
  (function() {
    function sha256(txt) {
      var data = new TextEncoder().encode(txt);
      return crypto.subtle.digest('SHA-256', data).then(function(buf) {
        return Array.from(new Uint8Array(buf)).map(function(b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
      });
    }
    var USERS = {
      "brancobarrinat581@gmail.com": { pwd: "b7bef4c1d9d83520b27d807ca0689f7b60ab5c3bc3cfede619e044b13560b931", uid: "dd9be8e9-14f1-4c27-bb96-4e6b6cb24f06" },
      "corina.pacini77@gmail.com": { pwd: "b7bef4c1d9d83520b27d807ca0689f7b60ab5c3bc3cfede619e044b13560b931", uid: "ca7f985f-4b40-41da-b55b-86b5bc045bcb" }
    };
    function ok(body) { return new Response(JSON.stringify(body), { status: 200, headers: {"Content-Type":"application/json"} }); }
    function err(msg) { return new Response(JSON.stringify({ error: "invalid_credentials", error_description: msg }), { status: 400, headers: {"Content-Type":"application/json"} }); }
    function loginOk(email, uid) {
      var now = Math.floor(Date.now() / 1000);
      return ok({
        access_token: "local-token-" + uid, token_type: "bearer", expires_in: 86400, expires_at: now + 86400, refresh_token: "local-refresh-" + uid,
        user: { id: uid, aud: "authenticated", role: "authenticated", email: email, email_confirmed_at: "2025-01-01T00:00:00Z", app_metadata: { provider: "email", providers: ["email"] }, user_metadata: {}, identities: [], created_at: "2025-01-01T00:00:00Z", updated_at: "2025-01-01T00:00:00Z" }
      });
    }
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url !== "string") return origFetch.apply(this, arguments);
      if (url.indexOf("/auth/v1/signup") !== -1) return Promise.resolve(err("Registro deshabilitado"));
      if (url.indexOf("/auth/v1/token") !== -1) {
        var body; try { body = (opts && opts.body) ? JSON.parse(opts.body) : {}; } catch(e) { body = {}; }
        if (url.indexOf("grant_type=refresh_token") !== -1 || body.grant_type === "refresh_token") {
          var fe = Object.keys(USERS)[0]; return Promise.resolve(loginOk(fe, USERS[fe].uid));
        }
        var email = (body.email || "").toLowerCase(), pwd = body.password || "";
        if (!USERS[email]) return Promise.resolve(err("Email no registrado"));
        return sha256(pwd).then(function(hash) {
          if (hash !== USERS[email].pwd) return err("Credenciales invalidas");
          return loginOk(email, USERS[email].uid);
        });
      }
      if (url.indexOf("/auth/v1/user") !== -1) {
        var auth = "";
        if (opts && opts.headers) {
          if (opts.headers instanceof Headers) auth = opts.headers.get("Authorization") || "";
          else if (typeof opts.headers === "object") auth = opts.headers.Authorization || opts.headers.authorization || "";
        }
        var token = auth.replace("Bearer ", "");
        if (token && token.length > 5) {
          var fe2 = null, uid2 = null;
          Object.keys(USERS).forEach(function(em) { if (token.indexOf(USERS[em].uid) !== -1) { fe2 = em; uid2 = USERS[em].uid; } });
          if (!fe2) { fe2 = Object.keys(USERS)[0]; uid2 = USERS[fe2].uid; }
          return Promise.resolve(ok({ id: uid2, aud: "authenticated", role: "authenticated", email: fe2, email_confirmed_at: "2025-01-01T00:00:00Z", app_metadata: { provider: "email" }, user_metadata: {}, identities: [], created_at: "2025-01-01T00:00:00Z", updated_at: "2025-01-01T00:00:00Z" }));
        }
        return Promise.resolve(new Response(JSON.stringify({ error: "not_authenticated" }), { status: 401, headers: {"Content-Type":"application/json"} }));
      }
      if (url.indexOf("/auth/v1/logout") !== -1) return Promise.resolve(ok({}));
      return origFetch.apply(this, arguments);
    };
  })();
  </script>

  <script>
  // === 3. ANALISTAS ===
  (function() {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", "analysts.json?t=" + Date.now(), false);
      x.send(null);
      if (x.status !== 200) return;
      var f = JSON.parse(x.responseText).fundamentals || {};
      var out = {}, n = 0;
      var CON = { strong_buy:"Strong Buy", buy:"Buy", hold:"Hold", underperform:"Sell", sell:"Sell" };
      Object.keys(f).forEach(function(tk) {
        var d = f[tk]; if (!d) return;
        var o = {};
        if (d.target != null) o.target = Math.round(d.target * 100) / 100;
        if (d.consensus) o.con = CON[d.consensus] || d.consensus;
        if (d.pe != null) o.pe = Math.round(d.pe) + (d.forwardPE != null ? "/" + Math.round(d.forwardPE) : "");
        if (d.analysts != null) o.analistas = d.analysts;
        if (Object.keys(o).length) { o.fuente = d.source || "Yahoo Finance"; out[tk] = o; n++; }
      });
      window.__FUND_REAL = out;
      if (n) console.log("📊 Analistas: " + n + " tickers");
    } catch (e) {}
  })();
  </script>
