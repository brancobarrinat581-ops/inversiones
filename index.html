    <script>
    // === CARGAR DATOS ANTES DE LA APP ===
    (async function() {
      // 1. Cargar portfolio.json (posiciones exactas IOL)
      try {
        const res = await fetch('portfolio.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('portfolio_iol', JSON.stringify(data));
          console.log('✅ Portfolio IOL cargado:', data.positions.length, 'posiciones');
        }
      } catch(e) { console.warn('portfolio.json no disponible'); }

      // 2. Cargar operaciones.json
      try {
        const res = await fetch('operaciones.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('operaciones_raw', JSON.stringify(data.operaciones));
          console.log('✅ Operaciones cargadas:', data.operaciones.length);
        }
      } catch(e) { console.warn('operaciones.json no disponible'); }

      // 3. Cargar prices.json
      try {
        const res = await fetch('prices.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('prices_data', JSON.stringify(data));
          console.log('✅ Precios cargados:', data.count, 'tickers');
        }
      } catch(e) { console.warn('prices.json no disponible'); }
    })();
    </script>
